<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">AchieveX Learning Logo</title>
  <desc id="desc">A blue and gold circular logo with an abstract A mark, books, graduation cap, and text AchieveX Learning.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2a"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d6ff"/>
      <stop offset="0.5" stop-color="#39b5ff"/>
      <stop offset="1" stop-color="#1d8fe8"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8c84e"/>
      <stop offset="0.5" stop-color="#f5b42d"/>
      <stop offset="1" stop-color="#d88400"/>
    </linearGradient>
    <linearGradient id="Ablue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36d6ff"/>
      <stop offset="0.4" stop-color="#12a7eb"/>
      <stop offset="1" stop-color="#0d5fe8"/>
    </linearGradient>
    <linearGradient id="Aorange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb526"/>
      <stop offset="0.55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff5e2d"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#143b75"/>
      <stop offset="1" stop-color="#102d68"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

