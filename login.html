<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Portal | AchieveX Learning</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="brand" href="index.html">
        <span class="brand-logo-frame"><img class="brand-logo" src="assets/branding/logo.jpeg" alt="AchieveX Learning logo" /></span>
        <span class="brand-text"><strong>AchieveX</strong><small>Learning</small></span>
      </a>
      <h1 style="color: var(--ink); font-size: 2.5rem; margin-top: 34px">Learning Portal</h1>
      <p>Login area for protected study material, tests, webinars and course resources.</p>
      <form>
        <label>Email <input type="email" placeholder="student@example.com" /></label>
        <label>Password <input type="password" placeholder="Password" /></label>
        <button class="btn dark-btn block-btn" type="button">Access Dashboard</button>
      </form>
      <div class="portal-grid" aria-label="Portal quick links">
        <a class="portal-link" id="study-material" href="index.html#study-material">Study Material</a>
        <a class="portal-link" id="current-affairs" href="index.html#current-affairs">Current Affairs</a>
        <a class="portal-link" id="magazine" href="index.html#magazine">Monthly Magazine</a>
        <a class="portal-link" id="webinars" href="index.html#webinars">Webinars</a>
        <a class="portal-link" id="tat" href="index.html#tests">TAT</a>
        <a class="portal-link" id="wat" href="index.html#tests">WAT</a>
        <a class="portal-link" id="srt" href="index.html#tests">SRT</a>
        <a class="portal-link" id="sdt" href="index.html#tests">SDT</a>
        <a class="portal-link" id="ppdt" href="index.html#tests">PPDT</a>
        <a class="portal-link" id="oir" href="index.html#tests">OIR</a>
      </div>
      <p><a class="text-link" href="index.html">Return Home</a></p>
    </main>
  </body>
</html>
